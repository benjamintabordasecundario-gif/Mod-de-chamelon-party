          static void n_role(JNIEnv*, jclass, jint to) { g_roleCmd = to; }
          static void n_whistle(JNIEnv*, jclass, jboolean on) { g_whistle = on; }
          static void n_paint(JNIEnv*, jclass, jfloat nx, jfloat ny, jint color, jfloat radius, jboolean start) {
              PPoint pt;
              pt.nx = nx; pt.ny = ny;
              pt.r = (float)((color >> 16) & 0xFF) / 255.0f;
              pt.g = (float)((color >> 8) & 0xFF) / 255.0f;
              pt.b = (float)(color & 0xFF) / 255.0f;
              pt.radius = radius;
              pt.start = start != 0;
              std::lock_guard<std::mutex> lk(g_mx);
              if (g_pts.size() < 200) g_pts.push_back(pt);
          }
          static void n_teleport(JNIEnv*, jclass, jint idx) { g_tpCmd = idx; }
          static jobjectArray n_names(JNIEnv* env, jclass) {
              std::vector<std::u16string> v;
              {
                  std::lock_guard<std::mutex> lk(g_mx);
                  v = g_names;
              }
              jclass strCls = env->FindClass("java/lang/String");
              jobjectArray arr = env->NewObjectArray((jsize)v.size(), strCls, nullptr);
              for (size_t i = 0; i < v.size(); i++) {
                  jstring js = env->NewString((const jchar*)v[i].data(), (jsize)v[i].size());
                  env->SetObjectArrayElement(arr, (jsize)i, js);
              }
              return arr;
          }
          
          // ---------- cargar el menu (Java) dentro del juego ----------
          static JavaVM* g_vm = nullptr;
          static jobject g_loader = nullptr;
          
          static bool getVM() {
              if (g_vm) return true;
              typedef jint (*GetVMs)(JavaVM**, jsize, jsize*);
              GetVMs f = (GetVMs)dlsym(RTLD_DEFAULT, "JNI_GetCreatedJavaVMs");
              const char* libs[] = { "libnativehelper.so", "libart.so", "libandroid_runtime.so" };
              for (int i = 0; i < 3 && !f; i++) {
                  void* h = dlopen(libs[i], RTLD_NOW);
                  if (h) f = (GetVMs)dlsym(h, "JNI_GetCreatedJavaVMs");
              }
              if (!f) { LOG("no encontre JNI_GetCreatedJavaVMs"); return false; }
              jsize n = 0;
              return f(&g_vm, 1, &n) == JNI_OK && n > 0 && g_vm;
          }
          
          static bool jexc(JNIEnv* env) {
              if (env->ExceptionCheck()) { env->ExceptionClear(); return true; }
              return false;
          }
          
          // Se llama al cargarse la libreria (en el hilo de Java): aqui FindClass si ve las clases del juego.
          static void captureLoader() {
              if (!getVM()) { LOG("ctor: sin VM"); return; }
              JNIEnv* env = nullptr;
              if (g_vm->GetEnv((void**)&env, JNI_VERSION_1_6) != JNI_OK || !env) { LOG("ctor: sin env"); return; }
              jclass up = env->FindClass("com/unity3d/player/UnityPlayer");
              if (jexc(env) || !up) { LOG("ctor: no vi UnityPlayer"); return; }
              jclass classCls = env->FindClass("java/lang/Class");
              jmethodID gcl = env->GetMethodID(classCls, "getClassLoader", "()Ljava/lang/ClassLoader;");
              jobject l = env->CallObjectMethod(up, gcl);
              if (jexc(env) || !l) { LOG("ctor: sin loader"); return; }
              g_loader = env->NewGlobalRef(l);
              LOG("ctor: class loader capturado");
          }
          
          static bool startUiEnv(JNIEnv* env) {
              jclass clCls = env->FindClass("java/lang/ClassLoader");
              jmethodID loadClass = env->GetMethodID(clCls, "loadClass", "(Ljava/lang/String;)Ljava/lang/Class;");
              jobject appLoader = g_loader;
              if (!appLoader) {
                  LOG("ui: probando via ActivityThread");
                  jclass atCls = env->FindClass("android/app/ActivityThread");
                  jmethodID curApp = (!jexc(env) && atCls) ?
                      env->GetStaticMethodID(atCls, "currentApplication", "()Landroid/app/Application;") : nullptr;
                  jexc(env);
                  jobject app = nullptr;
                  for (int i = 0; i < 120 && !app && curApp; i++) {
                      app = env->CallStaticObjectMethod(atCls, curApp);
                      if (jexc(env)) app = nullptr;
                      if (!app) usleep(500000);
                  }
                  if (app) {
                      jclass ctxCls = env->FindClass("android/content/Context");
                      jmethodID getCL = env->GetMethodID(ctxCls, "getClassLoader", "()Ljava/lang/ClassLoader;");
                      appLoader = env->CallObjectMethod(app, getCL);
                      jexc(env);
                  }
              }
              if (!appLoader) { setStatus("ERROR menu: no hay class loader"); return false; }
          
              const char* names[] = { "com.unity3d.player.UnityPlayer", "com.unity3d.player.UnityPlayerForActivityOrService" };
              jclass upCls = nullptr; jfieldID fAct = nullptr;
              for (int k = 0; k < 2 && !fAct; k++) {
                  jclass c = (jclass)env->CallObjectMethod(appLoader, loadClass, env->NewStringUTF(names[k]));
                  if (jexc(env) || !c) continue;
                  jfieldID f = env->GetStaticFieldID(c, "currentActivity", "Landroid/app/Activity;");
                  if (jexc(env) || !f) continue;
                  upCls = c; fAct = f;
              }
              if (!fAct) { setStatus("ERROR menu: no encuentro currentActivity"); return false; }
          
              jobject act = nullptr;
              for (int i = 0; i < 240 && !act; i++) {
                  act = env->GetStaticObjectField(upCls, fAct);
                  if (!act) usleep(500000);
              }
              if (!act) { setStatus("ERROR menu: no hay Activity"); return false; }
              LOG("ui: activity encontrada");
              sleep(3); // dejar que Unity arme su pantalla antes de poner el menu
          
              jclass actCls = env->GetObjectClass(act);
              jmethodID getCC = env->GetMethodID(actCls, "getCodeCacheDir", "()Ljava/io/File;");
              jobject dir = env->CallObjectMethod(act, getCC);
              if (jexc(env) || !dir) { setStatus("ERROR menu: sin carpeta cache"); return false; }
              jclass fileCls = env->FindClass("java/io/File");
              jmethodID getAbs = env->GetMethodID(fileCls, "getAbsolutePath", "()Ljava/lang/String;");
              jstring jpath = (jstring)env->CallObjectMethod(dir, getAbs);
              const char* cpath = env->GetStringUTFChars(jpath, nullptr);
              std::string optDir = cpath;
              env->ReleaseStringUTFChars(jpath, cpath);
              std::string dexPath = optDir + "/modmenu_ui.dex";
          
              unlink(dexPath.c_str());
              FILE* f = fopen(dexPath.c_str(), "wb");
              if (!f) { setStatus("ERROR menu: no pude escribir el dex"); return false; }
              fwrite(classes_dex, 1, classes_dex_len, f);
              fclose(f);
              chmod(dexPath.c_str(), 0400);
          
              jclass dcl = env->FindClass("dalvik/system/DexClassLoader");
              jmethodID ctor = env->GetMethodID(dcl, "<init>",
                  "(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/lang/ClassLoader;)V");
              jobject loader2 = env->NewObject(dcl, ctor, env->NewStringUTF(dexPath.c_str()),
                  env->NewStringUTF(optDir.c_str()), (jstring)nullptr, appLoader);
              if (jexc(env) || !loader2) { setStatus("ERROR menu: DexClassLoader fallo"); return false; }
          
              jclass menu = (jclass)env->CallObjectMethod(loader2, loadClass, env->NewStringUTF("com.mod.Menu"));
              if (jexc(env) || !menu) { setStatus("ERROR menu: no cargo la clase Menu"); return false; }
          
              JNINativeMethod nm[] = {
                  { (char*)"nNoclip",   (char*)"(Z)V",                 (void*)n_noclip },
                  { (char*)"nGod",      (char*)"(Z)V",                 (void*)n_god },
                  { (char*)"nSpeed",    (char*)"(F)V",                 (void*)n_speed },
                  { (char*)"nSize",     (char*)"(F)V",                 (void*)n_size },
                  { (char*)"nUnlock",   (char*)"()V",                  (void*)n_unlock },
                  { (char*)"nVertical", (char*)"(I)V",                 (void*)n_vertical },
                  { (char*)"nStatus",   (char*)"()Ljava/lang/String;", (void*)n_status },
                  { (char*)"nEsp",      (char*)"(Z)V",                 (void*)n_esp },
                  { (char*)"nGetEsp",   (char*)"()[F",                 (void*)n_getesp },
                  { (char*)"nFreecam",  (char*)"(Z)V",                 (void*)n_freecam },
                  { (char*)"nFly",      (char*)"(II)V",                (void*)n_fly },
                  { (char*)"nSpec",     (char*)"(I)V",                 (void*)n_spec },
                  { (char*)"nRole",     (char*)"(I)V",                 (void*)n_role },
                  { (char*)"nWhistle",  (char*)"(Z)V",                 (void*)n_whistle },
                  { (char*)"nPaint",    (char*)"(FFIFZ)V",             (void*)n_paint },
                  { (char*)"nTeleport", (char*)"(I)V",                 (void*)n_teleport },
                  { (char*)"nNames",    (char*)"()[Ljava/lang/String;", (void*)n_names },
              };
              if (env->RegisterNatives(menu, nm, (jint)(sizeof(nm) / sizeof(nm[0]))) != JNI_OK) { jexc(env); setStatus("ERROR menu: RegisterNatives"); return false; }
          
              jmethodID start = env->GetStaticMethodID(menu, "start", "(Landroid/app/Activity;)V");
              if (jexc(env) || !start) { setStatus("ERROR menu: sin start()"); return false; }
              env->CallStaticVoidMethod(menu, start, act);
              jexc(env);
              LOG("ui: menu iniciado");
              return true;
          }
          
          static void* uiWorker(void*) {
              LOG("uiWorker inicio");
              if (!getVM()) { setStatus("ERROR menu: sin JavaVM"); return nullptr; }
              JNIEnv* env = nullptr;
              if (g_vm->AttachCurrentThread(&env, nullptr) != JNI_OK) { setStatus("ERROR menu: no pude adjuntar hilo"); return nullptr; }
              if (!startUiEnv(env)) LOG("no se pudo mostrar el menu");
              g_vm->DetachCurrentThread();
              return nullptr;
          }
          
          static void* hookWorker(void*) {
              LOG("hookWorker inicio");
              for (int i = 0; i < 240 && !h_il2cpp; i++) {
                  h_il2cpp = dlopen("libil2cpp.so", RTLD_NOW | RTLD_NOLOAD);
                  if (!h_il2cpp) usleep(500000);
              }
              if (h_il2cpp && resolveApi()) {
                  sleep(4);
                  bool ok = false;
                  for (int i = 0; i < 90 && !ok; i++) {
                      ok = initGame();
                      if (!ok) sleep(1);
                  }
                  if (ok && installHooks()) setStatus("hooks listos, entra a una partida");
                  else setStatus("ERROR: no encontre las funciones del juego");
              } else {
                  setStatus("ERROR: no encontre il2cpp");
              }
              return nullptr;
          }
          
          __attribute__((constructor)) static void modInit() {
              LOG("modInit: libreria cargada");
              captureLoader();
              pthread_t t1, t2;
              pthread_create(&t1, nullptr, uiWorker, nullptr);
              pthread_detach(t1);
              pthread_create(&t2, nullptr, hookWorker, nullptr);
              pthread_detach(t2);
          }
