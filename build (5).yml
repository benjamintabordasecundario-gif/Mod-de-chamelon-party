              g_freeze = (fc || spec);
          }
          
          // ---- lista de nombres (se refresca en el hilo principal) ----
          static void refreshNames() {
              PInfo ps[24];
              int n = getPlayers(ps, 24);
              std::vector<std::u16string> v;
              for (int i = 0; i < n; i++) {
                  std::u16string nm;
                  void* str = *(void**)((char*)ps[i].np + offNPName);
                  if (str) {
                      int len = *(int*)((char*)str + 0x10);
                      if (len > 0 && len < 40) nm.assign((const char16_t*)((char*)str + 0x14), (size_t)len);
                  }
                  if (nm.empty()) nm = u"Jugador";
                  if (ps[i].local) nm += u" (tu)";
                  v.push_back(nm);
              }
              std::lock_guard<std::mutex> lk(g_mx);
              g_names.swap(v);
          }
          
          // ---- teletransportarse a un jugador ----
          static bool doTeleport(void* localPlayer, int idx, float* newY) {
              if (!mTeleport) return false;
              PInfo ps[24];
              int n = getPlayers(ps, 24);
              if (idx < 0 || idx >= n || ps[idx].local || !ps[idx].go) return false;
              void* ttr = goTransform(ps[idx].go);
              Vec3 q;
              if (!ttr || !getVec(mGetPos, ttr, &q)) return false;
              q.x += 1.0f; q.y += 0.3f;
              struct Quat { float x, y, z, w; } rot = { 0, 0, 0, 1 };
              void* a[2] = { &q, &rot };
              if (!inv(mTeleport, localPlayer, a)) return false;
              *newY = q.y;
              return true;
          }
          
          // ---- dibujar sobre tu personaje ----
          struct Ray3 { Vec3 o, d; };
          struct Col4 { float r, g, b, a; };
          
          static void processPaint() {
              std::vector<PPoint> pts;
              {
                  std::lock_guard<std::mutex> lk(g_mx);
                  if (g_pts.empty()) return;
                  pts.swap(g_pts);
              }
              void* painter = staticObj(fPainterInst);
              void* cam = nullptr;
              if (!painter || !mRaycast || !mLocalPos || !mPaintAt || !mScreenRay) return;
              if (!mCamMain || !inv(mCamMain, nullptr, nullptr, &cam) || !cam) return;
              int sw = 0, sh = 0;
              void *bw = nullptr, *bh = nullptr;
              inv(mScrW, nullptr, nullptr, &bw);
              inv(mScrH, nullptr, nullptr, &bh);
              if (!bw || !bh) return;
              sw = *(int*)il2cpp_object_unbox(bw);
              sh = *(int*)il2cpp_object_unbox(bh);
              int count = 0;
              for (size_t i = 0; i < pts.size() && count < 40; i++) {
                  const PPoint& pt = pts[i];
                  if (pt.start && mBake) inv(mBake, painter, nullptr);
                  Vec3 sp = { pt.nx * (float)sw, (1.0f - pt.ny) * (float)sh, 0.0f };
                  void* a1[1] = { &sp };
                  void* rbox = nullptr;
                  if (!inv(mScreenRay, cam, a1, &rbox) || !rbox) continue;
                  Ray3 ray = *(Ray3*)il2cpp_object_unbox(rbox);
                  int tri = -1;
                  Vec3 bary = { 0, 0, 0 };
                  void* a2[3] = { &ray, &tri, &bary };
                  void* hit = nullptr;
                  if (!inv(mRaycast, painter, a2, &hit) || !hit) continue;
                  if (!*(uint8_t*)il2cpp_object_unbox(hit)) continue;
                  void* a3[2] = { &tri, &bary };
                  void* lbox = nullptr;
                  if (!inv(mLocalPos, painter, a3, &lbox) || !lbox) continue;
                  Vec3 lp = *(Vec3*)il2cpp_object_unbox(lbox);
                  Col4 col = { pt.r, pt.g, pt.b, 1.0f };
                  float radius = pt.radius;
                  void* a4[3] = { &lp, &radius, &col };
                  inv(mPaintAt, painter, a4);
                  count++;
              }
          }
          
          static void applyLocal(void* p) {
              static void* last = nullptr;
              static float baseSpeed = 0, baseGrav = 0, curSize = 1.0f, holdY = 0;
              static Vec3 baseScale = {1, 1, 1};
              static bool speedTouched = false, noclipOn = false;
              static double lastT = 0, lastWhistle = 0;
              static int frame = 0;
          
              double t = nowSec();
              float dt = (float)(t - lastT);
              if (dt < 0 || dt > 0.1f) dt = 0.016f;
              lastT = t;
              frame++;
          
              void* tr = nullptr;
              inv(mGetTransform, p, nullptr, &tr);
          
              bool newPlayer = (p != last);
              if (newPlayer) {
                  last = p;
                  baseSpeed = *(float*)((char*)p + offSpeed);
                  baseGrav = *(float*)((char*)p + offGrav);
                  speedTouched = false; noclipOn = false; curSize = 1.0f;
                  baseScale = {1, 1, 1};
                  if (tr) getVec(mGetScale, tr, &baseScale);
                  setStatus("listo (jugador encontrado)");
              }
          
              // velocidad
              float sm = g_speed;
              if (sm != 1.0f || speedTouched) {
                  *(float*)((char*)p + offSpeed) = baseSpeed * sm;
                  speedTouched = (sm != 1.0f);
              }
          
              // tamano
              float sz = g_size;
              if (tr && (sz != curSize || (sz != 1.0f && frame % 30 == 0))) {
                  Vec3 v = { baseScale.x * sz, baseScale.y * sz, baseScale.z * sz };
                  setVec(mSetScale, tr, v);
                  curSize = sz;
              }
          
              // noclip
              void* col = *(void**)((char*)p + offCol);
              void* rb = *(void**)((char*)p + offRb);
              if (g_noclip) {
                  if (tr) {
                      Vec3 pos;
                      if (getVec(mGetPos, tr, &pos)) {
                          if (!noclipOn) holdY = pos.y;
                          holdY += (float)g_vy * 8.0f * dt;
                          pos.y = holdY;
                          setVec(mSetPos, tr, pos);
                      }
                  }
                  noclipOn = true;
                  setCollider(col, false);
                  *(float*)((char*)p + offGrav) = 0.0f;
                  if (rb) {
                      Vec3 v;
                      if (getVec(mGetVel, rb, &v)) { v.y = 0.0f; setVec(mSetVel, rb, v); }
                  }
              } else if (noclipOn) {
                  noclipOn = false;
                  setCollider(col, true);
                  *(float*)((char*)p + offGrav) = baseGrav;
              }
          
              // camara libre / espectear
              handleCamera(tr, dt, newPlayer);
          
              // teletransporte
              int tp = g_tpCmd.exchange(-1);
              if (tp >= 0) {
                  float ny = 0;
                  if (doTeleport(p, tp, &ny)) holdY = ny;
              }
          
              // lista de nombres y pintura
              if (frame % 60 == 1) refreshNames();
              processPaint();
          
              // ESP
              if (g_esp && (frame % 2 == 0)) {
                  Vec3 me = {0, 0, 0};
                  if (tr) getVec(mGetPos, tr, &me);
                  updateEsp(me);
              }
          
              // chiflido infinito
              if (g_whistle && (t - lastWhistle) > 1.2) {
                  lastWhistle = t;
                  doWhistleAll();
              }
          }
          
          static void tick(void* self, bool isPlayer) {
              if (g_unlock.exchange(false)) doUnlock();
              int rc = g_roleCmd.exchange(0);
              if (rc) doRole(rc);
              if (!isPlayer) return;
              void* lp = staticObj(fLocalPlayer);
              if (lp && lp == self) applyLocal(self);
          }
          
          static void (*orig_PlayerUpdate)(void*, void*);
          static void hook_PlayerUpdate(void* self, void* mi) {
              orig_PlayerUpdate(self, mi);
              tick(self, true);
          }
          
          static void (*orig_LobbyUpdate)(void*, void*);
          static void hook_LobbyUpdate(void* self, void* mi) {
              orig_LobbyUpdate(self, mi);
              tick(self, false);
          }
          
          static void (*orig_Kill)(void*, uint8_t, void*);
          static void hook_Kill(void* self, uint8_t killer, void* mi) {
              if (g_god) {
                  void* lp = staticObj(fLocalPlayer);
                  if (lp && lp == self) return; // no morir
              }
              orig_Kill(self, killer, mi);
          }
          
          static void (*orig_Move)(void*, void*);
          static void hook_Move(void* self, void* mi) {
              if (g_freeze) { void* lp = staticObj(fLocalPlayer); if (lp && lp == self) return; }
              orig_Move(self, mi);
          }
          static void (*orig_Jump)(void*, void*);
          static void hook_Jump(void* self, void* mi) {
              if (g_freeze) { void* lp = staticObj(fLocalPlayer); if (lp && lp == self) return; }
              orig_Jump(self, mi);
          }
          
          static bool installHooks() {
              void* pU = *(void**)mPlayerUpdate;
              void* pK = *(void**)mPlayerKill;
              if (!pU || !pK) return false;
              A64HookFunction(pU, (void*)hook_PlayerUpdate, (void**)&orig_PlayerUpdate);
              A64HookFunction(pK, (void*)hook_Kill, (void**)&orig_Kill);
              if (mLobbyUpdate && *(void**)mLobbyUpdate)
                  A64HookFunction(*(void**)mLobbyUpdate, (void*)hook_LobbyUpdate, (void**)&orig_LobbyUpdate);
              if (mPlayerMove && *(void**)mPlayerMove)
                  A64HookFunction(*(void**)mPlayerMove, (void*)hook_Move, (void**)&orig_Move);
              if (mPlayerJump && *(void**)mPlayerJump)
                  A64HookFunction(*(void**)mPlayerJump, (void*)hook_Jump, (void**)&orig_Jump);
              return true;
          }
          
          // ---------- funciones que llama el menu (Java) ----------
          static void n_noclip(JNIEnv*, jclass, jboolean on) { g_noclip = on; if (!on) g_vy = 0; }
          static void n_god(JNIEnv*, jclass, jboolean on) { g_god = on; }
