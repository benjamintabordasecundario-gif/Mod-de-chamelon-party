          // ---- zoom y modo de camara (primera / tercera persona) ----
          static void camExtras(void* p) {
              static void* lastOrbit = nullptr;
              static float baseZ = 0.0f;
              static bool zoomTouched = false, bodyHidden = false;
              void* orbit = staticObj(fOrbitInst);
              if (!orbit) return;
              if (orbit != lastOrbit) {
                  lastOrbit = orbit;
                  baseZ = *(float*)((char*)orbit + offCamOff + 8);
                  zoomTouched = false;
                  bodyHidden = false;
              }
              // zoom
              float z = g_zoom;
              if (z != 1.0f || zoomTouched) {
                  *(float*)((char*)orbit + offCamOff + 8) = baseZ * z;
                  *(float*)((char*)orbit + offTargetCamOff + 8) = baseZ * z;
                  zoomTouched = (z != 1.0f);
              }
              // modo de camara
              if (g_freeze) return;
              int mode = g_camMode;
              void* body = *(void**)((char*)p + offPMesh);
              if (mode == 1 || mode == 2) {
                  *(uint8_t*)((char*)orbit + offFP) = (mode == 2) ? 1 : 0;
                  if (mode == 2 && body && mRendEnabled) {
                      uint8_t off = 0; void* a[1] = { &off };
                      inv(mRendEnabled, body, a);
                      bodyHidden = true;
                  } else if (mode == 1 && bodyHidden && body && mRendEnabled) {
                      uint8_t on = 1; void* a[1] = { &on };
                      inv(mRendEnabled, body, a);
                      bodyHidden = false;
                  }
              } else if (bodyHidden && body && mRendEnabled) {
                  uint8_t on = 1; void* a[1] = { &on };
                  inv(mRendEnabled, body, a);
                  bodyHidden = false;
              }
          }
          
          // ---- utilidades para buscar objetos de Unity ----
          static std::string strLower(void* str) {
              std::string r;
              if (!str) return r;
              int len = *(int*)((char*)str + 0x10);
              const char16_t* ch = (const char16_t*)((char*)str + 0x14);
              for (int i = 0; i < len && i < 80; i++) {
                  char16_t c = ch[i];
                  if (c >= 'A' && c <= 'Z') c = c - 'A' + 'a';
                  r.push_back(c < 128 ? (char)c : '?');
              }
              return r;
          }
          
          static std::string objName(void* o) {
              void* s2 = nullptr;
              if (!o || !mObjGetName || !inv(mObjGetName, o, nullptr, &s2) || !s2) return "";
              return strLower(s2);
          }
          
          static bool findAllOfType(void* klass, void*** items, int* n) {
              if (!klass || !mResFindAll) return false;
              void* t = il2cpp_class_get_type(klass);
              void* tobj = t ? il2cpp_type_get_object(t) : nullptr;
              if (!tobj) return false;
              void* a[1] = { tobj };
              void* arr = nullptr;
              if (!inv(mResFindAll, nullptr, a, &arr) || !arr) return false;
              *n = *(int*)((char*)arr + 0x18);
              *items = (void**)((char*)arr + 0x20);
              return *n > 0;
          }
          
          static void activateChain(void* go) {
              uint8_t on = 1;
              void* a[1] = { &on };
              inv(mGOSetActive, go, a);
              void* tr = goTransform(go);
              for (int guard = 0; tr && guard < 32; guard++) {
                  void* par = nullptr;
                  if (!inv(mTrGetParent, tr, nullptr, &par) || !par) break;
                  void* pgo = nullptr;
                  if (!inv(mCompGetGO, par, nullptr, &pgo) || !pgo) break;
                  inv(mGOSetActive, pgo, a);
                  tr = par;
              }
          }
          
          // ---- activar el panel/boton de pintar del juego ----
          static void doEnablePaint() {
              if (!mResFindAll || !mGOSetActive || !mCompGetGO) { setStatus("pintura: faltan funciones del juego"); return; }
              int count = 0;
              void** items = nullptr;
              int n = 0;
              if (kHSV && findAllOfType(kHSV, &items, &n)) {
                  for (int i = 0; i < n && i < 20; i++) {
                      void* go = nullptr;
                      if (items[i] && inv(mCompGetGO, items[i], nullptr, &go) && go) { activateChain(go); count++; LOG("pintura: selector de color activado"); }
                  }
              }
              items = nullptr; n = 0;
              if (kGameObject && findAllOfType(kGameObject, &items, &n)) {
                  const char* keys[] = { "paint", "pint", "draw", "dibuj", "brush", "pincel", "hsv" };
                  for (int i = 0; i < n && i < 9000 && count < 60; i++) {
                      void* go = items[i];
                      if (!go) continue;
                      std::string nm = objName(go);
                      if (nm.empty()) continue;
                      bool hit = false;
                      for (int k = 0; k < 7 && !hit; k++) if (nm.find(keys[k]) != std::string::npos) hit = true;
                      if (hit) { activateChain(go); count++; LOG("pintura: activado '%s'", nm.c_str()); }
                  }
              }
              char m[96];
              if (count) snprintf(m, sizeof(m), "pintura: active %d objetos, mira el lobby", count);
              else snprintf(m, sizeof(m), "pintura: no encontre el boton de pintar aqui");
              setStatus(m);
          }
          
          // ---- piel blanca para dibujar ----
          static void doSkin(int cmd) {
              void* painter = staticObj(fPainterInst);
              if (!painter) { setStatus("piel: no hay personaje en esta pantalla"); return; }
              if (cmd == 1) {
                  bool done = false;
                  void* skins = *(void**)((char*)painter + offSkins);
                  if (skins && mSetSkin) {
                      int n = *(int*)((char*)skins + 0x18);
                      for (int i = 0; i < n && i < 64; i++) {
                          void* tx = ((void**)((char*)skins + 0x20))[i];
                          std::string nm = objName(tx);
                          LOG("skin[%d] = %s", i, nm.c_str());
                          if (!done && (nm.find("white") != std::string::npos || nm.find("blanc") != std::string::npos ||
                                        nm.find("blank") != std::string::npos || nm.find("plain") != std::string::npos)) {
                              void* sname = nullptr;
                              inv(mObjGetName, tx, nullptr, &sname);
                              void* a[1] = { sname };
                              if (sname && inv(mSetSkin, painter, a)) done = true;
                          }
                      }
                  }
                  if (!done && mDeleteSkin) done = inv(mDeleteSkin, painter, nullptr);
                  if (mClearPaint) inv(mClearPaint, painter, nullptr);
                  setStatus(done ? "piel blanca puesta, ya puedes dibujar" : "piel: no pude ponerla");
              } else if (cmd == 2) {
                  if (mRestoreSkin && inv(mRestoreSkin, painter, nullptr)) setStatus("skin restaurada");
                  else setStatus("piel: no pude restaurarla");
              } else if (cmd == 3) {
                  if (mClearPaint && inv(mClearPaint, painter, nullptr)) setStatus("pintura borrada");
              }
          }
          
          // ---- ocultar la interfaz del juego (para capturas limpias) ----
          static std::vector<void*> g_hiddenCanvas;
          static void doHideUI(bool hide) {
              if (hide) {
                  if (!kCanvas || !mResFindAll || !mBehGetEnabled || !mBehSetEnabled) { setStatus("interfaz: no disponible"); return; }
                  void** items = nullptr;
                  int n = 0;
                  if (!findAllOfType(kCanvas, &items, &n)) { setStatus("interfaz: no encontre nada que ocultar"); return; }
                  g_hiddenCanvas.clear();
                  for (int i = 0; i < n && i < 64; i++) {
                      void* c = items[i];
                      if (!c) continue;
                      void* en = nullptr;
                      if (inv(mBehGetEnabled, c, nullptr, &en) && en && *(uint8_t*)il2cpp_object_unbox(en)) {
                          uint8_t off = 0;
                          void* a[1] = { &off };
                          if (inv(mBehSetEnabled, c, a)) { il2cpp_gchandle_new(c, 0); g_hiddenCanvas.push_back(c); }
                      }
                  }
                  setStatus("interfaz del juego oculta");
              } else {
                  uint8_t on = 1;
                  for (size_t i = 0; i < g_hiddenCanvas.size(); i++) {
                      void* a[1] = { &on };
                      inv(mBehSetEnabled, g_hiddenCanvas[i], a);
                  }
                  g_hiddenCanvas.clear();
                  setStatus("interfaz del juego visible");
              }
          }
          
          // ---- ajustes extra de la camara (sensibilidad, limites, FOV) ----
          static void camExtras2() {
              static void* lastOrbit = nullptr;
              static float baseH = 0, baseV = 0, baseMax = 0, baseMin = 0, baseTMax = 0, baseFov = 0;
              static bool sensTouched = false, limTouched = false, fovTouched = false;
              void* orbit = staticObj(fOrbitInst);
              if (!orbit) return;
              if (orbit != lastOrbit) {
                  lastOrbit = orbit;
                  baseH = *(float*)((char*)orbit + offHAim);
                  baseV = *(float*)((char*)orbit + offVAim);
                  baseMax = *(float*)((char*)orbit + offMaxV);
                  baseMin = *(float*)((char*)orbit + offMinV);
                  baseTMax = *(float*)((char*)orbit + offTMaxV);
                  sensTouched = limTouched = fovTouched = false;
                  baseFov = 0;
              }
              float sm = g_sens;
              if (sm != 1.0f || sensTouched) {
                  *(float*)((char*)orbit + offHAim) = baseH * sm;
                  *(float*)((char*)orbit + offVAim) = baseV * sm;
                  sensTouched = (sm != 1.0f);
              }
              bool vl = g_vlimit;
              if (vl) {
                  *(float*)((char*)orbit + offMaxV) = 89.0f;
                  *(float*)((char*)orbit + offMinV) = -89.0f;
                  *(float*)((char*)orbit + offTMaxV) = 89.0f;
                  limTouched = true;
              } else if (limTouched) {
                  *(float*)((char*)orbit + offMaxV) = baseMax;
                  *(float*)((char*)orbit + offMinV) = baseMin;
                  *(float*)((char*)orbit + offTMaxV) = baseTMax;
                  limTouched = false;
              }
              float fv = g_fov;
              if ((fv != 1.0f || fovTouched) && mCamMain && mCamSetFov && mCamGetFov) {
                  void* cam = nullptr;
                  if (inv(mCamMain, nullptr, nullptr, &cam) && cam) {
                      if (baseFov <= 0.0f) {
                          void* box = nullptr;
                          if (inv(mCamGetFov, cam, nullptr, &box) && box) baseFov = *(float*)il2cpp_object_unbox(box);
                      }
                      if (baseFov > 0.0f) {
                          float nf = baseFov * fv;
                          void* a[1] = { &nf };
                          inv(mCamSetFov, cam, a);
                          fovTouched = (fv != 1.0f);
                      }
                  }
              }
          }
          
          static void applyLocal(void* p) {
              static void* last = nullptr;
              static float baseClimb = 0, baseClimbAcc = 0, baseRot = 0, baseCoyote = 0;
              static bool climbTouched = false, turnTouched = false, coyoteTouched = false;
              static Vec3 slotPos[3], startPos = {0, 0, 0};
              static bool slotHas[3] = {false, false, false}, startHas = false;
              static int sinceNew = 0;
              static float baseSpeed = 0, baseGrav = 0, baseJump = 0, curSize = 1.0f, holdY = 0;
              static bool jumpTouched = false, gravTouched = false, hasSaved = false;
              static Vec3 savedPos = {0, 0, 0};
              static Vec3 baseScale = {1, 1, 1};
              static bool speedTouched = false, noclipOn = false;
              static double lastT = 0, lastWhistle = 0;
              static int frame = 0;
          
              double t = nowSec();
              float dt = (float)(t - lastT);
              if (dt < 0 || dt > 0.1f) dt = 0.016f;
              lastT = t;
              frame++;
          
              void* tr = nullptr;
              inv(mGetTransform, p, nullptr, &tr);
          
              bool newPlayer = (p != last);
              if (newPlayer) {
                  last = p;
                  baseSpeed = *(float*)((char*)p + offSpeed);
                  baseGrav = *(float*)((char*)p + offGrav);
                  baseJump = *(float*)((char*)p + offJump);
                  baseClimb = *(float*)((char*)p + offClimb);
                  baseClimbAcc = *(float*)((char*)p + offClimbAcc);
                  baseRot = *(float*)((char*)p + offRot);
                  baseCoyote = *(float*)((char*)p + offCoyote);
                  climbTouched = false; turnTouched = false; coyoteTouched = false;
                  startHas = false; sinceNew = 0;
                  jumpTouched = false; gravTouched = false;
                  speedTouched = false; noclipOn = false; curSize = 1.0f;
                  baseScale = {1, 1, 1};
                  if (tr) getVec(mGetScale, tr, &baseScale);
                  setStatus("listo (jugador encontrado)");
              }
          
              // velocidad
              float sm = g_speed;
              if (sm != 1.0f || speedTouched) {
                  *(float*)((char*)p + offSpeed) = baseSpeed * sm;
                  speedTouched = (sm != 1.0f);
              }
          
              // salto
              float jm = g_jump;
              if (jm != 1.0f || jumpTouched) {
                  *(float*)((char*)p + offJump) = baseJump * jm;
                  jumpTouched = (jm != 1.0f);
              }
          
              // escalada, giro y tiempo de gracia
              float cl = g_climb;
              if (cl != 1.0f || climbTouched) {
                  *(float*)((char*)p + offClimb) = baseClimb * cl;
                  *(float*)((char*)p + offClimbAcc) = baseClimbAcc * cl;
                  climbTouched = (cl != 1.0f);
              }
              float tn = g_turn;
              if (tn != 1.0f || turnTouched) {
                  *(float*)((char*)p + offRot) = baseRot * tn;
                  turnTouched = (tn != 1.0f);
              }
              float co = g_coyote;
              if (co != 1.0f || coyoteTouched) {
                  *(float*)((char*)p + offCoyote) = baseCoyote * co;
                  coyoteTouched = (co != 1.0f);
              }
          
              // tamano
              float sz = g_size;
              if (tr && (sz != curSize || (sz != 1.0f && frame % 30 == 0))) {
                  Vec3 v = { baseScale.x * sz, baseScale.y * sz, baseScale.z * sz };
                  setVec(mSetScale, tr, v);
                  curSize = sz;
              }
          
              // noclip
              void* col = *(void**)((char*)p + offCol);
              void* rb = *(void**)((char*)p + offRb);
              if (g_noclip) {
                  if (tr) {
                      Vec3 pos;
                      if (getVec(mGetPos, tr, &pos)) {
                          if (!noclipOn) holdY = pos.y;
                          holdY += (float)g_vy * 8.0f * dt;
                          pos.y = holdY;
                          setVec(mSetPos, tr, pos);
                      }
                  }
                  noclipOn = true;
                  setCollider(col, false);
                  *(float*)((char*)p + offGrav) = 0.0f;
                  if (rb) {
                      Vec3 v;
                      if (getVec(mGetVel, rb, &v)) { v.y = 0.0f; setVec(mSetVel, rb, v); }
                  }
              } else {
                  if (noclipOn) {
                      noclipOn = false;
                      setCollider(col, true);
                      *(float*)((char*)p + offGrav) = baseGrav;
                      gravTouched = false;
                  }
                  float gm = g_gravity;
                  if (gm != 1.0f || gravTouched) {
                      *(float*)((char*)p + offGrav) = baseGrav * gm;
                      gravTouched = (gm != 1.0f);
                  }
              }
          
              // camara libre / espectear
              handleCamera(tr, dt, newPlayer);
          
              // zoom y primera/tercera persona
              camExtras(p);
              camExtras2();
          
              // posicion inicial, ranuras y volver
              sinceNew++;
              if (!startHas && sinceNew == 120 && tr) {
                  if (getVec(mGetPos, tr, &startPos)) startHas = true;
              }
              int pc = g_posCmd.exchange(0);
              if (pc >= 10 && pc < 13 && tr) {
                  if (getVec(mGetPos, tr, &slotPos[pc - 10])) { slotHas[pc - 10] = true; setStatus("posicion guardada"); }
              } else if (pc >= 20 && pc <= 30) {
                  Vec3 q = {0, 0, 0};
                  bool ok = false;
                  if (pc == 30) { if (startHas) { q = startPos; ok = true; } else setStatus("todavia no tengo el punto de inicio"); }
                  else if (slotHas[pc - 20]) { q = slotPos[pc - 20]; ok = true; }
                  else setStatus("esa ranura esta vacia");
                  if (ok && mTeleport) {
                      struct Quat { float x, y, z, w; } rot = { 0, 0, 0, 1 };
                      void* a[2] = { &q, &rot };
                      if (inv(mTeleport, p, a)) { holdY = q.y; setStatus("teletransportado"); }
                  }
              }
          
              // autopintado
              if (newPlayer && autoState != 0) autoFinish("autopintado cancelado");
              int acmd = g_autoCmd.exchange(0);
              if (acmd == 1 && autoState == 0) startAuto(p);
              else if (acmd == 2 && autoState != 0) autoFinish("autopintado cancelado");
              if (autoState == 1 && (t - autoT0) > 2.5) autoFinish("ERROR autopintado: no pude leer la pantalla");
              if (autoState == 2) autoStep();
          
              // teletransporte
              int tp = g_tpCmd.exchange(-1);
              if (tp >= 0) {
                  float ny = 0;
                  if (doTeleport(p, tp, &ny)) holdY = ny;
              }
          
              // lista de nombres y pintura
              if (frame % 60 == 1) refreshNames();
              processPaint();
          
              // texto sobre tu cabeza
              if (g_headOn) updateHead(tr);
          
              // ESP
              if (g_esp && (frame % 2 == 0)) {
                  Vec3 me = {0, 0, 0};
                  if (tr) getVec(mGetPos, tr, &me);
                  updateEsp(me);
              }
          
              // chiflido infinito
              if (g_whistle && (t - lastWhistle) > 1.2) {
                  lastWhistle = t;
                  doWhistleAll();
              }
          }
          
          static void tick(void* self, bool isPlayer) {
              static double lastCoin = 0.0;
              static float lastTS = 1.0f;
              static int tsCount = 0;
              if (g_unlock.exchange(false)) doUnlock();
              int cc = g_coinsCmd.exchange(0);
              if (cc > 0) doCoins(cc);
              if (g_coinsLoop) {
                  double tn = nowSec();
                  if (tn - lastCoin > 1.5) { lastCoin = tn; doCoins(100); }
              }
              if (g_paintEnable.exchange(0)) doEnablePaint();
              int sk = g_skinCmd.exchange(0);
              if (sk) doSkin(sk);
              static bool uiHidden = false;
              bool wantHide = g_hideUI;
              if (wantHide != uiHidden) { doHideUI(wantHide); uiHidden = wantHide; }
              float ts = g_timeScale;
              if (ts != lastTS || (ts != 1.0f && (++tsCount % 120) == 0)) { applyTimeScale(ts); lastTS = ts; }
              if (g_chatPending.exchange(false)) doChat();
              int rc = g_roleCmd.exchange(0);
              if (rc) doRole(rc);
              if (!isPlayer) return;
              void* lp = staticObj(fLocalPlayer);
              if (lp && lp == self) applyLocal(self);
          }
          
          static void (*orig_PlayerUpdate)(void*, void*);
          static void hook_PlayerUpdate(void* self, void* mi) {
              if (g_airJump && self) {
                  void* lp0 = staticObj(fLocalPlayer);
                  if (lp0 && lp0 == self) *(float*)((char*)self + offCoyoteCnt) = 1.0f;
              }
              orig_PlayerUpdate(self, mi);
              tick(self, true);
          }
          
          static void (*orig_LobbyUpdate)(void*, void*);
          static void hook_LobbyUpdate(void* self, void* mi) {
              orig_LobbyUpdate(self, mi);
              tick(self, false);
          }
          
          static void (*orig_Kill)(void*, uint8_t, void*);
          static void hook_Kill(void* self, uint8_t killer, void* mi) {
              if (g_god) {
                  void* lp = staticObj(fLocalPlayer);
                  if (lp && lp == self) return; // no morir
              }
              orig_Kill(self, killer, mi);
          }
          
          static void (*orig_Move)(void*, void*);
