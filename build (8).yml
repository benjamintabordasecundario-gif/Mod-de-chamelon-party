              if (g_airJump && self) {
                  void* lp1 = staticObj(fLocalPlayer);
                  if (lp1 && lp1 == self) { *(float*)((char*)self + offCoyoteCnt) = 1.0f; *(uint8_t*)((char*)self + offGroundedFlag) = 1; }
              }
              if (g_freeze) { void* lp = staticObj(fLocalPlayer); if (lp && lp == self) return; }
              orig_Jump(self, mi);
          }
          
          static void (*orig_OnGUI)(void*, void*);
          static void hook_OnGUI(void* self, void* mi) {
              orig_OnGUI(self, mi);
              if (autoState == 1) autoCapture();
