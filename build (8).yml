          static void modlog(const char* fmt, ...) {
              char buf[512];
              va_list ap; va_start(ap, fmt); vsnprintf(buf, sizeof(buf), fmt, ap); va_end(ap);
              __android_log_print(ANDROID_LOG_INFO, TAG, "%s", buf);
              static char path[300] = "";
              if (!path[0]) {
                  char pkg[160] = "";
                  FILE* c = fopen("/proc/self/cmdline", "r");
                  if (c) { fread(pkg, 1, sizeof(pkg) - 1, c); fclose(c); }
                  char dir[260];
                  snprintf(dir, sizeof(dir), "/sdcard/Android/data/%s/files", pkg);
                  mkdir(dir, 0777);
                  snprintf(path, sizeof(path), "%s/modmenu_log.txt", dir);
              }
              FILE* f = fopen(path, "a");
              if (f) { fprintf(f, "%s\n", buf); fclose(f); }
          }
