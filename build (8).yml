          // ---- teletransportarse a un jugador ----
          static bool doTeleport(void* localPlayer, int idx, float* newY) {
              if (!mTeleport) return false;
              PInfo ps[24];
              int n = getPlayers(ps, 24);
              if (idx < 0 || idx >= n || ps[idx].local || !ps[idx].go) return false;
              void* ttr = goTransform(ps[idx].go);
              Vec3 q;
              if (!ttr || !getVec(mGetPos, ttr, &q)) return false;
              q.x += 1.0f; q.y += 0.3f;
              struct Quat { float x, y, z, w; } rot = { 0, 0, 0, 1 };
              void* a[2] = { &q, &rot };
              if (!inv(mTeleport, localPlayer, a)) return false;
              *newY = q.y;
              return true;
          }
          
          // ---- dibujar sobre tu personaje ----
          struct Ray3 { Vec3 o, d; };
          struct Col4 { float r, g, b, a; };
          
          static void processPaint() {
              std::vector<PPoint> pts;
              {
                  std::lock_guard<std::mutex> lk(g_mx);
                  if (g_pts.empty()) return;
                  pts.swap(g_pts);
              }
              void* painter = staticObj(fPainterInst);
              void* cam = nullptr;
              if (!painter || !mRaycast || !mLocalPos || !mPaintAt || !mScreenRay) return;
              if (!mCamMain || !inv(mCamMain, nullptr, nullptr, &cam) || !cam) return;
              int sw = 0, sh = 0;
              void *bw = nullptr, *bh = nullptr;
              inv(mScrW, nullptr, nullptr, &bw);
              inv(mScrH, nullptr, nullptr, &bh);
              if (!bw || !bh) return;
              sw = *(int*)il2cpp_object_unbox(bw);
              sh = *(int*)il2cpp_object_unbox(bh);
              int count = 0;
              for (size_t i = 0; i < pts.size() && count < 40; i++) {
                  const PPoint& pt = pts[i];
                  if (pt.start && mBake) inv(mBake, painter, nullptr);
                  Vec3 sp = { pt.nx * (float)sw, (1.0f - pt.ny) * (float)sh, 0.0f };
                  void* a1[1] = { &sp };
                  void* rbox = nullptr;
                  if (!inv(mScreenRay, cam, a1, &rbox) || !rbox) continue;
                  Ray3 ray = *(Ray3*)il2cpp_object_unbox(rbox);
                  int tri = -1;
                  Vec3 bary = { 0, 0, 0 };
                  void* a2[3] = { &ray, &tri, &bary };
                  void* hit = nullptr;
                  if (!inv(mRaycast, painter, a2, &hit) || !hit) continue;
                  if (!*(uint8_t*)il2cpp_object_unbox(hit)) continue;
                  void* a3[2] = { &tri, &bary };
                  void* lbox = nullptr;
                  if (!inv(mLocalPos, painter, a3, &lbox) || !lbox) continue;
                  Vec3 lp = *(Vec3*)il2cpp_object_unbox(lbox);
                  Col4 col = { pt.r, pt.g, pt.b, 1.0f };
                  float radius = pt.radius;
                  void* a4[3] = { &lp, &radius, &col };
                  inv(mPaintAt, painter, a4);
                  count++;
              }
          }
          
          // ---- AUTOPINTADO: copia los colores del fondo sobre tu personaje ----
          struct Bounds3 { Vec3 c, e; };
          static int autoState = 0; // 0 libre, 1 esperando captura, 2 pintando
          static double autoT0 = 0;
          static int autoTries = 0;
          static void* autoRend[2];
          static int autoRendN = 0;
          static void* bgTex = nullptr;
          static int bgW = 0, bgH = 0;
          static std::vector<std::pair<float, float> > autoPts;
          static size_t autoIdx = 0;
          static Vec3 autoCamPos = {0, 0, 0};
          
          static bool getScreen(int* sw, int* sh) {
              void *bw = nullptr, *bh = nullptr;
              inv(mScrW, nullptr, nullptr, &bw);
              inv(mScrH, nullptr, nullptr, &bh);
              if (!bw || !bh) return false;
              *sw = *(int*)il2cpp_object_unbox(bw);
              *sh = *(int*)il2cpp_object_unbox(bh);
              return *sw > 0 && *sh > 0;
          }
          
          static void setRenderers(bool on) {
              uint8_t b = on ? 1 : 0;
              for (int i = 0; i < autoRendN; i++) {
                  void* a[1] = { &b };
                  inv(mRendEnabled, autoRend[i], a);
              }
          }
          
          static void autoFinish(const char* msg) {
              setRenderers(true);
              if (bgTex && mObjDestroy) { void* a[1] = { bgTex }; inv(mObjDestroy, nullptr, a); }
              bgTex = nullptr;
              autoState = 0;
              g_autoBusy = false;
              setStatus(msg);
          }
          
          static void startAuto(void* p) {
              if (!mRendEnabled || !mRendBounds || !mReadPixels || !mGetPixel || !mT2DCtor || !mCamMain || !mW2S) {
                  setStatus("ERROR autopintado: faltan funciones del juego");
                  return;
              }
              void* painter = staticObj(fPainterInst);
              if (!painter) { setStatus("autopintado: no hay pintor, entra al lobby o a una partida"); return; }
              autoRendN = 0;
              void* r1 = *(void**)((char*)p + offPMesh);
              void* r2 = *(void**)((char*)painter + offPaintSMR);
              if (r1) autoRend[autoRendN++] = r1;
              if (r2 && r2 != r1) autoRend[autoRendN++] = r2;
              if (!autoRendN) { setStatus("ERROR autopintado: no encontre el cuerpo"); return; }
          
              void* bb = nullptr;
              if (!inv(mRendBounds, autoRend[0], nullptr, &bb) || !bb) { setStatus("ERROR autopintado: sin medidas"); return; }
              Bounds3 b = *(Bounds3*)il2cpp_object_unbox(bb);
              void* cam = nullptr;
              int sw = 0, sh = 0;
              if (!inv(mCamMain, nullptr, nullptr, &cam) || !cam || !getScreen(&sw, &sh)) { setStatus("ERROR autopintado: sin camara"); return; }
          
              float minx = 1e9f, miny = 1e9f, maxx = -1e9f, maxy = -1e9f;
              for (int i = 0; i < 8; i++) {
                  Vec3 c = { b.c.x + ((i & 1) ? b.e.x : -b.e.x), b.c.y + ((i & 2) ? b.e.y : -b.e.y), b.c.z + ((i & 4) ? b.e.z : -b.e.z) };
                  void* a[1] = { &c };
                  void* box = nullptr;
                  if (!inv(mW2S, cam, a, &box) || !box) { setStatus("ERROR autopintado: proyeccion"); return; }
                  Vec3 sc = *(Vec3*)il2cpp_object_unbox(box);
                  if (sc.z <= 0.0f) { setStatus("autopintado: mira a tu personaje con la camara"); return; }
                  float nx = sc.x / (float)sw, ny = 1.0f - sc.y / (float)sh;
                  if (nx < minx) minx = nx; if (nx > maxx) maxx = nx;
                  if (ny < miny) miny = ny; if (ny > maxy) maxy = ny;
              }
              if (minx < 0) minx = 0; if (miny < 0) miny = 0; if (maxx > 1) maxx = 1; if (maxy > 1) maxy = 1;
              if (maxx - minx < 0.02f || maxy - miny < 0.02f) { setStatus("autopintado: tu personaje no se ve en pantalla"); return; }
          
              autoPts.clear();
              const int N = 48;
              for (int j = 0; j < N; j++)
                  for (int i = 0; i < N; i++)
                      autoPts.push_back(std::make_pair(minx + (maxx - minx) * ((float)i + 0.5f) / (float)N,
                                                       miny + (maxy - miny) * ((float)j + 0.5f) / (float)N));
              autoIdx = 0;
              void* ctr = nullptr;
              if (inv(mGetTransform, cam, nullptr, &ctr) && ctr) getVec(mGetPos, ctr, &autoCamPos);
          
              setRenderers(false);
              autoState = 1;
              autoTries = 0;
              autoT0 = nowSec();
              g_autoBusy = true;
              setStatus("autopintado: capturando el fondo...");
          }
          
          // Se llama desde OnGUI (despues de dibujar la escena, con el personaje oculto).
          static void autoCapture() {
              if (nowSec() - autoT0 > 2.0 || autoTries >= 10) { autoFinish("ERROR autopintado: no pude leer la pantalla"); return; }
              autoTries++;
              int sw = 0, sh = 0;
              if (!getScreen(&sw, &sh)) return;
              void* tex = il2cpp_object_new(kTexture2D);
              int w = sw, h = sh, fmt = 4;
              uint8_t mip = 0;
              void* ca[4] = { &w, &h, &fmt, &mip };
              if (!tex || !inv(mT2DCtor, tex, ca)) return;
              il2cpp_gchandle_new(tex, 0);
              if (mSetActive) { void* a0[1] = { nullptr }; inv(mSetActive, nullptr, a0); }
              struct Rect4 { float x, y, w, h; } rect = { 0, 0, (float)w, (float)h };
              int z = 0;
              void* ra[3] = { &rect, &z, &z };
              if (!inv(mReadPixels, tex, ra)) return;
          
              // validar que no salio negro
              float sum = 0;
              for (int k = 0; k < 12; k++) {
                  int px = (w * (1 + (k % 4) * 2)) / 8, py = (h * (1 + (k / 4) * 2)) / 6;
                  void* a[2] = { &px, &py };
                  void* cb = nullptr;
                  if (inv(mGetPixel, tex, a, &cb) && cb) {
                      Col4 c = *(Col4*)il2cpp_object_unbox(cb);
                      sum += c.r + c.g + c.b;
                  }
              }
              if (sum < 0.01f) {
                  if (mObjDestroy) { void* a[1] = { tex }; inv(mObjDestroy, nullptr, a); }
                  return; // se reintenta en el siguiente OnGUI
              }
              bgTex = tex; bgW = w; bgH = h;
              setRenderers(true);
              autoState = 2;
              autoIdx = 0;
              setStatus("autopintado: pintando 0%");
          }
          
          static void autoStep() {
              void* painter = staticObj(fPainterInst);
              void* cam = nullptr;
              int sw = 0, sh = 0;
              if (!painter || !mCamMain || !inv(mCamMain, nullptr, nullptr, &cam) || !cam || !getScreen(&sw, &sh)) {
                  autoFinish("ERROR autopintado: se perdio el pintor");
                  return;
              }
              void* ctr = nullptr;
              Vec3 cp;
              if (inv(mGetTransform, cam, nullptr, &ctr) && ctr && getVec(mGetPos, ctr, &cp)) {
                  float dx = cp.x - autoCamPos.x, dy = cp.y - autoCamPos.y, dz = cp.z - autoCamPos.z;
                  if (dx * dx + dy * dy + dz * dz > 0.0036f) { autoFinish("autopintado cancelado: moviste la camara"); return; }
              }
              if (autoIdx == 0 && mBake) inv(mBake, painter, nullptr);
              int rays = 0, stamps = 0;
              size_t lastPct = autoIdx * 10 / (autoPts.size() ? autoPts.size() : 1);
              while (autoIdx < autoPts.size() && rays < 40 && stamps < 16) {
                  std::pair<float, float> pt = autoPts[autoIdx++];
                  rays++;
                  Vec3 sp = { pt.first * (float)sw, (1.0f - pt.second) * (float)sh, 0.0f };
                  void* a1[1] = { &sp };
                  void* rbox = nullptr;
                  if (!inv(mScreenRay, cam, a1, &rbox) || !rbox) continue;
                  Ray3 ray = *(Ray3*)il2cpp_object_unbox(rbox);
                  int tri = -1;
                  Vec3 bary = { 0, 0, 0 };
                  void* a2[3] = { &ray, &tri, &bary };
                  void* hit = nullptr;
                  if (!inv(mRaycast, painter, a2, &hit) || !hit) continue;
                  if (!*(uint8_t*)il2cpp_object_unbox(hit)) continue;
                  void* a3[2] = { &tri, &bary };
                  void* lbox = nullptr;
                  if (!inv(mLocalPos, painter, a3, &lbox) || !lbox) continue;
                  Vec3 lp = *(Vec3*)il2cpp_object_unbox(lbox);
          
                  int px = (int)(pt.first * (float)bgW), py = (int)((1.0f - pt.second) * (float)bgH);
                  if (px < 0) px = 0; if (px >= bgW) px = bgW - 1;
                  if (py < 0) py = 0; if (py >= bgH) py = bgH - 1;
                  void* a5[2] = { &px, &py };
                  void* cb = nullptr;
                  if (!inv(mGetPixel, bgTex, a5, &cb) || !cb) continue;
                  Col4 col = *(Col4*)il2cpp_object_unbox(cb);
                  col.a = 1.0f;
                  float radius = g_autoRadius;
                  void* a4[3] = { &lp, &radius, &col };
                  inv(mPaintAt, painter, a4);
                  stamps++;
              }
              size_t pct = autoIdx * 10 / (autoPts.size() ? autoPts.size() : 1);
              if (pct != lastPct && autoIdx < autoPts.size()) {
                  char m[64];
                  snprintf(m, sizeof(m), "autopintado: pintando %d%%", (int)(pct * 10));
                  setStatus(m);
              }
              if (autoIdx >= autoPts.size()) autoFinish("autopintado: listo");
          }
          
