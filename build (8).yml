name: Construir mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Escribir archivos
        run: |
          mkdir -p work/java/com/mod work/jni out
          cat > work/java/com/mod/Menu.java <<'EOF_JAVA'
          package com.mod;
          
          import android.app.Activity;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.ColorFilter;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CompoundButton;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          
          public class Menu {
          
              static native void nNoclip(boolean on);
              static native void nGod(boolean on);
              static native void nSpeed(float mult);
              static native void nSize(float mult);
              static native void nUnlock();
              static native void nVertical(int dir);
              static native String nStatus();
              static native void nEsp(boolean on);
              static native float[] nGetEsp();
              static native void nFreecam(boolean on);
              static native void nFly(int axis, int dir);
              static native void nSpec(int cmd);
              static native void nRole(int to);
              static native void nWhistle(boolean on);
              static native void nPaint(float nx, float ny, int color, float radius, boolean start);
              static native void nTeleport(int idx);
              static native void nAuto(int cmd, float radius);
              static native void nChat(String text);
              static native void nJump(float v);
              static native void nGravity(float v);
              static native void nZoom(float v);
              static native void nTimeScale(float v);
              static native void nCamMode(int m);
              static native void nCoins(int n);
              static native void nCoinsLoop(boolean on);
              static native void nSavePos(int c);
              static native void nSens(float v);
              static native void nFov(float v);
              static native void nClimb(float v);
              static native void nTurn(float v);
              static native void nCoyote(float v);
              static native void nVLimit(boolean on);
              static native void nAirJump(boolean on);
              static native void nHideUI(boolean on);
              static native void nPaintEnable();
              static native void nSkin(int c);
              static native void nHeadOn(boolean on);
              static native float[] nHead();
              static native String[] nNames();
          
              private static boolean started = false;
              private static boolean isSeeker = false;
              private static EspView esp;
              private static LinearLayout pad;
              private static PaintView paintView;
              private static LinearLayout paintBar;
              private static Switch paintSwitch;
              private static int paintColor = Color.RED;
              private static float paintRadius = 0.05f;
              private static HeadView headView;
              private static ImageView bubbleRef;
              private static TextView banner;
              private static EditText msgInput;
              private static Switch chatSwitch;
              private static final android.os.Handler uiHandler = new android.os.Handler(android.os.Looper.getMainLooper());
              private static final Runnable hideBanner = new Runnable() {
                  public void run() { if (banner != null) banner.setVisibility(View.GONE); }
              };
          
              // Envoltorios seguros: si algo falla en nativo, el juego no se cierra.
              static void cNoclip(boolean v) { try { nNoclip(v); } catch (Throwable t) { } }
              static void cGod(boolean v) { try { nGod(v); } catch (Throwable t) { } }
              static void cSpeed(float v) { try { nSpeed(v); } catch (Throwable t) { } }
              static void cSize(float v) { try { nSize(v); } catch (Throwable t) { } }
              static void cUnlock() { try { nUnlock(); } catch (Throwable t) { } }
              static void cVertical(int v) { try { nVertical(v); } catch (Throwable t) { } }
              static void cEsp(boolean v) { try { nEsp(v); } catch (Throwable t) { } }
              static void cFreecam(boolean v) { try { nFreecam(v); } catch (Throwable t) { } }
              static void cFly(int axis, int dir) { try { nFly(axis, dir); } catch (Throwable t) { } }
              static void cSpec(int v) { try { nSpec(v); } catch (Throwable t) { } }
              static void cRole(int v) { try { nRole(v); } catch (Throwable t) { } }
              static void cWhistle(boolean v) { try { nWhistle(v); } catch (Throwable t) { } }
              static void cPaint(float nx, float ny, int c, float r, boolean st) { try { nPaint(nx, ny, c, r, st); } catch (Throwable t) { } }
              static void cTeleport(int i) { try { nTeleport(i); } catch (Throwable t) { } }
              static void cAuto(int cmd, float r) { try { nAuto(cmd, r); } catch (Throwable t) { } }
              static void cChat(String t) { try { nChat(t); } catch (Throwable e) { } }
              static void cHeadOn(boolean v) { try { nHeadOn(v); } catch (Throwable t) { } }
              static void cJump(float v) { try { nJump(v); } catch (Throwable t) { } }
              static void cGravity(float v) { try { nGravity(v); } catch (Throwable t) { } }
              static void cZoom(float v) { try { nZoom(v); } catch (Throwable t) { } }
              static void cTimeScale(float v) { try { nTimeScale(v); } catch (Throwable t) { } }
              static void cCamMode(int v) { try { nCamMode(v); } catch (Throwable t) { } }
              static void cCoins(int v) { try { nCoins(v); } catch (Throwable t) { } }
              static void cCoinsLoop(boolean v) { try { nCoinsLoop(v); } catch (Throwable t) { } }
              static void cSavePos(int v) { try { nSavePos(v); } catch (Throwable t) { } }
              static void cSens(float v) { try { nSens(v); } catch (Throwable t) { } }
              static void cFov(float v) { try { nFov(v); } catch (Throwable t) { } }
              static void cClimb(float v) { try { nClimb(v); } catch (Throwable t) { } }
              static void cTurn(float v) { try { nTurn(v); } catch (Throwable t) { } }
              static void cCoyote(float v) { try { nCoyote(v); } catch (Throwable t) { } }
              static void cVLimit(boolean v) { try { nVLimit(v); } catch (Throwable t) { } }
              static void cAirJump(boolean v) { try { nAirJump(v); } catch (Throwable t) { } }
              static void cHideUI(boolean v) { try { nHideUI(v); } catch (Throwable t) { } }
              static void cPaintEnable() { try { nPaintEnable(); } catch (Throwable t) { } }
              static void cSkin(int v) { try { nSkin(v); } catch (Throwable t) { } }
              static String[] cNames() {
                  try {
                      String[] n = nNames();
                      return n == null ? new String[0] : n;
                  } catch (Throwable t) { return new String[0]; }
              }
              static String cStatus() {
                  try { return nStatus(); } catch (Throwable t) { return "sin conexion con el juego"; }
              }
          
              public static void start(final Activity a) {
                  if (started) return;
                  started = true;
                  a.runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              build(a);
                          } catch (Throwable t) {
                              started = false;
                          }
                      }
                  });
              }
          
              private static int dp(Activity a, float v) {
                  return (int) (v * a.getResources().getDisplayMetrics().density + 0.5f);
              }
          
              // Carita de Pacman dibujada por codigo (no necesita imagen).
              private static class Pacman extends Drawable {
                  private final Paint body = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint eye = new Paint(Paint.ANTI_ALIAS_FLAG);
          
                  Pacman() {
                      body.setColor(Color.rgb(255, 214, 0));
                      body.setStyle(Paint.Style.FILL);
                      line.setColor(Color.rgb(130, 90, 0));
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(5f);
                      eye.setColor(Color.BLACK);
                      eye.setStyle(Paint.Style.FILL);
                  }
          
                  @Override
                  public void draw(Canvas c) {
                      Rect b = getBounds();
                      float pad = b.width() * 0.06f;
                      RectF r = new RectF(b.left + pad, b.top + pad, b.right - pad, b.bottom - pad);
                      c.drawArc(r, 32f, 296f, true, body);
                      c.drawArc(r, 32f, 296f, true, line);
                      c.drawCircle(b.left + b.width() * 0.52f, b.top + b.height() * 0.28f, b.width() * 0.06f, eye);
                  }
          
                  @Override
                  public void setAlpha(int alpha) { body.setAlpha(alpha); }
          
                  @Override
                  public void setColorFilter(ColorFilter cf) { body.setColorFilter(cf); }
          
                  @Override
                  public int getOpacity() { return PixelFormat.TRANSLUCENT; }
              }
          
              // Capa que dibuja marcadores sobre los demas jugadores.
              private static class EspView extends View {
                  private final Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private boolean enabled = false;
          
                  EspView(Activity a) {
                      super(a);
                      ring.setStyle(Paint.Style.STROKE);
                      ring.setStrokeWidth(6f);
                      txt.setColor(Color.WHITE);
                      txt.setTextSize(30f);
                      txt.setTextAlign(Paint.Align.CENTER);
                      txt.setShadowLayer(4f, 0f, 0f, Color.BLACK);
                      setVisibility(View.GONE);
                  }
          
                  void setOn(boolean on) {
                      enabled = on;
                      setVisibility(on ? View.VISIBLE : View.GONE);
                      if (on) invalidate();
                  }
          
                  @Override
                  protected void onDraw(Canvas c) {
                      if (!enabled) return;
                      float[] d = null;
                      try { d = nGetEsp(); } catch (Throwable t) { }
                      if (d != null && d.length >= 1) {
                          int n = (int) d[0];
                          int w = getWidth();
                          int h = getHeight();
                          for (int i = 0; i < n; i++) {
                              int base = 1 + i * 4;
                              if (base + 3 >= d.length) break;
                              float x = d[base] * w;
                              float y = d[base + 1] * h;
                              int role = (int) d[base + 2];
                              float dist = d[base + 3];
                              ring.setColor(role == 1 ? Color.rgb(255, 60, 60) : Color.rgb(60, 255, 90));
                              c.drawCircle(x, y, 26f, ring);
                              c.drawText(Math.round(dist) + "m", x, y - 36f, txt);
                          }
                      }
                      postInvalidateOnAnimation();
                  }
              }
          
              // Capa que recibe tu dedo cuando estas en modo dibujar.
              private static class PaintView extends View {
                  private boolean on = false;
          
                  PaintView(Activity a) {
                      super(a);
                      setVisibility(View.GONE);
                  }
          
                  void setOn(boolean v) {
                      on = v;
                      setVisibility(v ? View.VISIBLE : View.GONE);
                  }
          
                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      if (!on) return false;
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return true;
                      int ac = e.getActionMasked();
                      if (ac == MotionEvent.ACTION_DOWN || ac == MotionEvent.ACTION_MOVE) {
                          if (ac == MotionEvent.ACTION_MOVE) {
                              for (int i = 0; i < e.getHistorySize(); i++) {
                                  cPaint(e.getHistoricalX(i) / w, e.getHistoricalY(i) / h, paintColor, paintRadius, false);
                              }
                          }
                          cPaint(e.getX() / w, e.getY() / h, paintColor, paintRadius, ac == MotionEvent.ACTION_DOWN);
                      }
                      return true;
                  }
              }
          
              // Texto que flota sobre tu personaje durante 5 segundos.
              private static class HeadView extends View {
                  private final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint bp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private String text = "";
                  private boolean on = false;
                  private long until = 0;
          
                  HeadView(Activity a) {
                      super(a);
                      tp.setColor(Color.WHITE);
                      tp.setTextSize(40f);
                      tp.setTextAlign(Paint.Align.CENTER);
                      tp.setTypeface(Typeface.DEFAULT_BOLD);
                      bp.setColor(Color.argb(200, 0, 0, 0));
                      setVisibility(View.GONE);
                  }
          
                  void show(String t) {
                      text = t;
                      on = true;
                      until = System.currentTimeMillis() + 5000;
                      setVisibility(View.VISIBLE);
                      cHeadOn(true);
                      invalidate();
                  }
          
                  @Override
                  protected void onDraw(Canvas c) {
                      if (!on) return;
                      if (System.currentTimeMillis() > until) {
                          on = false;
                          setVisibility(View.GONE);
                          cHeadOn(false);
                          return;
                      }
                      float[] h = null;
                      try { h = nHead(); } catch (Throwable t) { }
                      if (h != null && h.length >= 3 && h[2] > 0.5f) {
                          float x = h[0] * getWidth();
                          float y = h[1] * getHeight();
                          float w = tp.measureText(text);
                          RectF r = new RectF(x - w / 2f - 18f, y - 64f, x + w / 2f + 18f, y - 8f);
                          c.drawRoundRect(r, 18f, 18f, bp);
                          c.drawText(text, x, y - 22f, tp);
                      }
                      postInvalidateOnAnimation();
                  }
              }
          
              private static void showBanner(String t) {
                  if (banner == null) return;
                  banner.setText(t);
                  banner.setVisibility(View.VISIBLE);
                  uiHandler.removeCallbacks(hideBanner);
                  uiHandler.postDelayed(hideBanner, 5000);
              }
          
              private static Button smallButton(Activity a, String text) {
                  Button b = new Button(a);
                  b.setText(text);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setPadding(0, 0, 0, 0);
                  return b;
              }
          
              // Barra de colores y tamano (aparece a la derecha en modo dibujar).
              private static LinearLayout buildPaintBar(final Activity a) {
                  LinearLayout bar = new LinearLayout(a);
                  bar.setOrientation(LinearLayout.VERTICAL);
                  int[] cols = { Color.RED, Color.rgb(255, 140, 0), Color.YELLOW, Color.GREEN, Color.CYAN,
                          Color.BLUE, Color.rgb(160, 32, 240), Color.rgb(255, 105, 180), Color.WHITE, Color.BLACK };
                  for (int i = 0; i < cols.length; i++) {
                      final int col = cols[i];
                      Button b = new Button(a);
                      b.setBackgroundColor(col);
                      b.setOnClickListener(new View.OnClickListener() {
                          public void onClick(View v) { paintColor = col; }
                      });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(a, 34), dp(a, 34));
                      lp.setMargins(dp(a, 2), dp(a, 2), dp(a, 2), dp(a, 2));
                      bar.addView(b, lp);
                  }
                  Button minus = smallButton(a, "-");
                  minus.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          paintRadius = Math.max(0.005f, paintRadius / 1.3f);
                          Toast.makeText(a, "Pincel: " + String.format(java.util.Locale.US, "%.3f", paintRadius),
                                  Toast.LENGTH_SHORT).show();
                      }
                  });
                  Button plus = smallButton(a, "+");
                  plus.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          paintRadius = Math.min(0.4f, paintRadius * 1.3f);
                          Toast.makeText(a, "Pincel: " + String.format(java.util.Locale.US, "%.3f", paintRadius),
                                  Toast.LENGTH_SHORT).show();
                      }
                  });
                  Button done = smallButton(a, "OK");
                  done.setOnClickListener(new View.OnClickListener() {
                      public void onClick(View v) {
                          if (paintSwitch != null) paintSwitch.setChecked(false);
                      }
                  });
                  LinearLayout.LayoutParams sl = new LinearLayout.LayoutParams(dp(a, 34), dp(a, 34));
                  sl.setMargins(dp(a, 2), dp(a, 6), dp(a, 2), dp(a, 2));
                  bar.addView(minus, sl);
                  LinearLayout.LayoutParams sl2 = new LinearLayout.LayoutParams(dp(a, 34), dp(a, 34));
                  sl2.setMargins(dp(a, 2), dp(a, 2), dp(a, 2), dp(a, 2));
                  bar.addView(plus, sl2);
                  LinearLayout.LayoutParams sl3 = new LinearLayout.LayoutParams(dp(a, 34), dp(a, 34));
                  sl3.setMargins(dp(a, 2), dp(a, 2), dp(a, 2), dp(a, 2));
                  bar.addView(done, sl3);
                  return bar;
              }
          
              private static void build(final Activity a) {
                  final FrameLayout root = new FrameLayout(a);
          
                  esp = new EspView(a);
                  root.addView(esp, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
          
                  pad = buildPad(a);
                  pad.setVisibility(View.GONE);
                  FrameLayout.LayoutParams padlp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  padlp.gravity = Gravity.BOTTOM | Gravity.LEFT;
                  padlp.leftMargin = dp(a, 12);
                  padlp.bottomMargin = dp(a, 12);
                  root.addView(pad, padlp);
          
                  paintView = new PaintView(a);
                  root.addView(paintView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  paintBar = buildPaintBar(a);
                  paintBar.setVisibility(View.GONE);
                  FrameLayout.LayoutParams pblp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  pblp.gravity = Gravity.RIGHT | Gravity.CENTER_VERTICAL;
                  pblp.rightMargin = dp(a, 6);
                  root.addView(paintBar, pblp);
          
                  headView = new HeadView(a);
                  root.addView(headView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
          
                  banner = new TextView(a);
                  banner.setTextColor(Color.WHITE);
                  banner.setTextSize(26f);
                  banner.setTypeface(Typeface.DEFAULT_BOLD);
                  banner.setGravity(Gravity.CENTER);
                  banner.setPadding(dp(a, 22), dp(a, 12), dp(a, 22), dp(a, 12));
                  GradientDrawable bbg = new GradientDrawable();
                  bbg.setColor(Color.argb(210, 0, 0, 0));
                  bbg.setCornerRadius(dp(a, 14));
                  banner.setBackground(bbg);
                  banner.setVisibility(View.GONE);
                  FrameLayout.LayoutParams bnlp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  bnlp.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  bnlp.topMargin = dp(a, 40);
                  root.addView(banner, bnlp);
          
                  final int bs = dp(a, 54);
                  final ImageView bubble = new ImageView(a);
                  bubble.setImageDrawable(new Pacman());
                  final FrameLayout.LayoutParams blp = new FrameLayout.LayoutParams(bs, bs);
                  blp.leftMargin = dp(a, 10);
                  blp.topMargin = dp(a, 140);
                  root.addView(bubble, blp);
                  bubbleRef = bubble;
          
                  final LinearLayout panel = buildPanel(a);
                  final ScrollView scroll = new ScrollView(a);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(235, 20, 20, 30));
                  bg.setCornerRadius(dp(a, 16));
                  bg.setStroke(dp(a, 2), Color.rgb(255, 214, 0));
                  scroll.setBackground(bg);
                  scroll.setClickable(true);
                  scroll.addView(panel);
                  scroll.setVisibility(View.GONE);
                  int maxH = (int) (a.getResources().getDisplayMetrics().heightPixels * 0.85f);
                  FrameLayout.LayoutParams plp = new FrameLayout.LayoutParams(dp(a, 290), maxH);
                  plp.gravity = Gravity.CENTER;
                  root.addView(scroll, plp);
          
                  final TextView statusView = (TextView) panel.getTag();
          
                  bubble.setOnTouchListener(new View.OnTouchListener() {
                      float downX, downY;
                      int startL, startT;
                      boolean moved;
          
                      public boolean onTouch(View v, MotionEvent e) {
                          int ac = e.getActionMasked();
                          if (ac == MotionEvent.ACTION_DOWN) {
                              downX = e.getRawX();
                              downY = e.getRawY();
                              startL = blp.leftMargin;
                              startT = blp.topMargin;
                              moved = false;
                              return true;
                          } else if (ac == MotionEvent.ACTION_MOVE) {
                              float dx = e.getRawX() - downX;
                              float dy = e.getRawY() - downY;
                              if (Math.abs(dx) > dp(a, 6) || Math.abs(dy) > dp(a, 6)) moved = true;
                              if (moved) {
                                  blp.leftMargin = Math.max(0, (int) (startL + dx));
                                  blp.topMargin = Math.max(0, (int) (startT + dy));
                                  bubble.setLayoutParams(blp);
                              }
                              return true;
                          } else if (ac == MotionEvent.ACTION_UP) {
                              if (!moved) {
                                  if (scroll.getVisibility() == View.VISIBLE) {
                                      scroll.setVisibility(View.GONE);
                                  } else {
                                      statusView.setText("Estado: " + cStatus());
                                      scroll.setVisibility(View.VISIBLE);
                                  }
                              }
                              return true;
                          }
                          return false;
                      }
                  });
          
                  final ViewGroup.LayoutParams full = new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  a.addContentView(root, full);
          
                  // Si Unity reemplaza la pantalla y quita el menu, lo volvemos a poner.
                  final android.os.Handler h = new android.os.Handler(android.os.Looper.getMainLooper());
                  h.postDelayed(new Runnable() {
                      public void run() {
                          try {
                              if (root.getParent() == null) a.addContentView(root, full);
                          } catch (Throwable t) { }
                          h.postDelayed(this, 3000);
                      }
                  }, 3000);
              }
          
              private static TextView label(Activity a, String text, float size, boolean bold) {
                  TextView t = new TextView(a);
                  t.setText(text);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }
          
              private static Switch makeSwitch(Activity a, String text, CompoundButton.OnCheckedChangeListener l) {
                  Switch s = new Switch(a);
                  s.setText(text);
                  s.setTextColor(Color.WHITE);
                  s.setTextSize(16f);
                  s.setPadding(0, dp(a, 6), 0, dp(a, 6));
                  s.setOnCheckedChangeListener(l);
                  return s;
              }
          
              private static void addSeek(final Activity a, LinearLayout p, final String name,
                                          int max, int init, final boolean isSpeed) {
                  final TextView tv = label(a, name + ": 1.00x", 14f, false);
                  tv.setPadding(0, dp(a, 8), 0, 0);
                  p.addView(tv);
                  SeekBar sb = new SeekBar(a);
                  sb.setMax(max);
                  sb.setProgress(init);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int prog, boolean fromUser) {
                          float m = isSpeed ? (4 + prog) / 4f : (3 + prog) / 10f;
                          tv.setText(name + ": " + String.format(java.util.Locale.US, "%.2f", m) + "x");
                          if (isSpeed) cSpeed(m); else cSize(m);
                      }
                      public void onStartTrackingTouch(SeekBar s) { }
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  p.addView(sb);
              }
          
              // Barra generica: valor = (base + progreso) / div. which: 0 salto, 1 gravedad, 2 zoom, 3 tiempo.
              private static void addSeekGeneric(final Activity a, LinearLayout p, final String name,
                                                 int max, int init, final int base, final float div, final int which) {
                  final TextView tv = label(a, name + ": 1.00x", 14f, false);
                  tv.setPadding(0, dp(a, 8), 0, 0);
                  p.addView(tv);
                  SeekBar sb = new SeekBar(a);
                  sb.setMax(max);
                  sb.setProgress(init);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar s, int prog, boolean fromUser) {
                          float m = (base + prog) / div;
                          tv.setText(name + ": " + String.format(java.util.Locale.US, "%.2f", m) + "x");
                          if (which == 0) cJump(m);
                          else if (which == 1) cGravity(m);
                          else if (which == 2) cZoom(m);
                          else if (which == 3) cTimeScale(m);
                          else if (which == 4) cSens(m);
                          else if (which == 5) cFov(m);
                          else if (which == 6) cClimb(m);
                          else if (which == 7) cTurn(m);
                          else cCoyote(m);
                      }
                      public void onStartTrackingTouch(SeekBar s) { }
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  p.addView(sb);
              }
          
              // Boton que actua mientras lo mantienes presionado. mode 0 = noclip vertical, 1 = camara libre.
              private static Button holdButton(Activity a, String text, final int mode, final int axis, final int dir) {
                  Button b = new Button(a);
                  b.setText(text);
                  b.setOnTouchListener(new View.OnTouchListener() {
                      public boolean onTouch(View v, MotionEvent e) {
                          int ac = e.getActionMasked();
                          if (ac == MotionEvent.ACTION_DOWN) {
                              if (mode == 0) cVertical(dir); else cFly(axis, dir);
                          } else if (ac == MotionEvent.ACTION_UP || ac == MotionEvent.ACTION_CANCEL) {
                              if (mode == 0) cVertical(0); else cFly(axis, 0);
                          }
                          return true;
                      }
                  });
                  return b;
              }
          
