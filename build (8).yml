      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y patchelf xxd
      - name: Compilar menu (Java a dex)
        run: |
          cd work
          ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -1)
          D8=$(ls -d $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -1)
          echo "android.jar: $ANDROID_JAR"
          echo "d8: $D8"
          mkdir -p classes dexout
          javac -encoding UTF-8 --release 8 -cp "$ANDROID_JAR" -d classes java/com/mod/Menu.java
          $D8 --release --min-api 23 --lib "$ANDROID_JAR" --output dexout $(find classes -name '*.class')
          cp dexout/classes.dex jni/classes.dex
          cd jni
          xxd -i classes.dex > dex_data.h
          head -c 200 dex_data.h
      - name: Compilar codigo nativo
        run: |
          cd work/jni
          git clone --depth 1 https://github.com/Rprop/And64InlineHook.git And64InlineHook
          ls -la And64InlineHook
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ls -la build/*.so
      - name: Preparar archivos finales
        run: |
          cp work/jni/build/libmodmenu.so out/libmodmenu.so
          cp work/libmain.so out/libmain.so
          patchelf --add-needed libmodmenu.so out/libmain.so
          readelf -d out/libmain.so | grep NEEDED
          ls -la out
      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu
          path: out/
