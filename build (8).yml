          // ---------- logica en el hilo principal de Unity ----------
          static double nowSec() {
              timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);
              return ts.tv_sec + ts.tv_nsec * 1e-9;
          }
          
          static void doUnlock() {
              bool done = false;
              void* s = staticObj(fSkinsInst);
              if (s && inv(mUnlockSkins, s, nullptr)) done = true;
              void* e = staticObj(fEmotesInst);
              if (e && inv(mUnlockEmotes, e, nullptr)) done = true;
              if (!done) g_unlock = true; // se reintenta cuando abras skins/emotes
              else setStatus("desbloqueado");
          }
          
          static void setCollider(void* col, bool on) {
              if (!col) return;
              uint8_t b = on ? 1 : 0;
              void* a[1] = { &b };
              inv(mColEnabled, col, a);
          }
          
          static bool getVec(void* m, void* obj, Vec3* out) {
              void* box = nullptr;
              if (!inv(m, obj, nullptr, &box) || !box) return false;
              *out = *(Vec3*)il2cpp_object_unbox(box);
              return true;
          }
          
          static void setVec(void* m, void* obj, Vec3 v) {
              void* a[1] = { &v };
              inv(m, obj, a);
          }
          
          // ---- jugadores ----
          struct PInfo { void* np; void* go; uint8_t id; int role; bool local; };
          
          static int getPlayers(PInfo* out, int maxn) {
              void* nm = staticObj(fNetInst);
              if (!nm) return 0;
              void* list = *(void**)((char*)nm + offPlayers);
              if (!list) return 0;
              void* items = *(void**)((char*)list + 0x10);
              int size = *(int*)((char*)list + 0x18);
              if (!items || size <= 0) return 0;
              int n = 0;
              for (int i = 0; i < size && n < maxn; i++) {
                  void* np = ((void**)((char*)items + 0x20))[i];
                  if (!np) continue;
                  out[n].np = np;
                  out[n].go = *(void**)((char*)np + offNPObj);
                  out[n].id = *(uint8_t*)((char*)np + offNPId);
                  out[n].role = *(int*)((char*)np + offNPRole);
                  out[n].local = *(uint8_t*)((char*)np + offNPLocal) != 0;
                  n++;
              }
              return n;
          }
          
          static void* goTransform(void* go) {
              void* t = nullptr;
              if (!go || !inv(mGOGetTransform, go, nullptr, &t)) return nullptr;
              return t;
          }
          
          // ---- ESP: posiciones en pantalla de los demas ----
          static void updateEsp(Vec3 myPos) {
              int w = 1 - g_espIdx.load();
              float* b = g_espBuf[w];
              int n = 0;
              void* cam = nullptr;
              if (mCamMain && mW2S && inv(mCamMain, nullptr, nullptr, &cam) && cam) {
                  int sw = 0, sh = 0;
                  void *bw = nullptr, *bh = nullptr;
                  inv(mScrW, nullptr, nullptr, &bw);
                  inv(mScrH, nullptr, nullptr, &bh);
                  if (bw && bh) { sw = *(int*)il2cpp_object_unbox(bw); sh = *(int*)il2cpp_object_unbox(bh); }
                  PInfo ps[24];
                  int cnt = (sw > 0 && sh > 0) ? getPlayers(ps, 24) : 0;
                  for (int i = 0; i < cnt && n < 20; i++) {
                      if (ps[i].local || !ps[i].go) continue;
                      void* tr = goTransform(ps[i].go);
                      if (!tr) continue;
                      Vec3 p;
                      if (!getVec(mGetPos, tr, &p)) continue;
                      Vec3 head = { p.x, p.y + 1.0f, p.z };
                      void* a[1] = { &head };
                      void* box = nullptr;
                      if (!inv(mW2S, cam, a, &box) || !box) continue;
                      Vec3 sc = *(Vec3*)il2cpp_object_unbox(box);
                      if (sc.z <= 0.0f) continue;
                      float dx = p.x - myPos.x, dy = p.y - myPos.y, dz = p.z - myPos.z;
                      float* e = b + 1 + n * 4;
                      e[0] = sc.x / (float)sw;
                      e[1] = 1.0f - sc.y / (float)sh;
                      e[2] = (float)ps[i].role;
                      e[3] = __builtin_sqrtf(dx * dx + dy * dy + dz * dz);
                      n++;
                  }
              }
              b[0] = (float)n;
              g_espIdx = w;
          }
          
          // ---- rol ----
          static void doRole(int cmd) {
              void* nm = staticObj(fNetInst);
              if (!nm) return;
              void* np = *(void**)((char*)nm + offLocalNP);
              if (!np) return;
              uint8_t id = *(uint8_t*)((char*)np + offNPId);
              if (cmd == 1) {
                  uint8_t a = id, b = id;
                  void* args[2] = { &a, &b };
                  inv(mNMConvert, nm, args);
              } else {
                  int32_t r = 0; // Hidder
                  void* args[1] = { &r };
                  inv(mNPSetRole, np, args);
              }
          }
          
          // ---- chiflido de todos (solo se oye en tu telefono) ----
          static void doWhistleAll() {
              void* nm = staticObj(fNetInst);
              if (!nm || !mWhistleRpc) return;
              void* list = *(void**)((char*)nm + offIdents);
              if (!list) return;
              void* items = *(void**)((char*)list + 0x10);
              int size = *(int*)((char*)list + 0x18);
              if (!items) return;
              for (int i = 0; i < size && i < 64; i++) {
                  void* o = ((void**)((char*)items + 0x20))[i];
                  if (o && il2cpp_object_get_class(o) == kPlayerClass) inv(mWhistleRpc, o, nullptr);
              }
          }
          
          // ---- camara libre y espectear ----
          static void* dummyTr = nullptr;
          
          static bool ensureDummy() {
              if (dummyTr) return true;
              if (!kGameObject || !mGOCtor || !mGOGetTransform) return false;
              void* go = il2cpp_object_new(kGameObject);
              if (!go) return false;
              if (!inv(mGOCtor, go, nullptr)) return false;
              il2cpp_gchandle_new(go, 0);
              void* tr = nullptr;
              if (!inv(mGOGetTransform, go, nullptr, &tr) || !tr) return false;
              il2cpp_gchandle_new(tr, 0);
              dummyTr = tr;
              return true;
          }
          
          static void handleCamera(void* tr, float dt, bool newPlayer) {
              static void* origTarget = nullptr;
              static bool camHooked = false, dummyActive = false;
              static int specIdx = -1;
              if (newPlayer) { dummyTr = nullptr; camHooked = false; dummyActive = false; specIdx = -1; }
          
              void* orbit = staticObj(fOrbitInst);
              bool fc = g_freecam;
          
              int cmd = g_specCmd.exchange(0);
              if (cmd == 2) specIdx = -1;
              else if (cmd != 0) {
                  PInfo ps[24];
                  int n = getPlayers(ps, 24);
                  if (n > 0) {
                      if (specIdx < 0) specIdx = (cmd > 0) ? 0 : n - 1;
                      else specIdx = (specIdx + cmd + n) % n;
                  }
              }
              bool spec = (specIdx >= 0) && !fc;
          
              if ((fc || spec) && orbit) {
                  if (!camHooked) { origTarget = *(void**)((char*)orbit + offOrbitPlayer); camHooked = true; }
                  void* target = nullptr;
                  if (fc) {
                      if (ensureDummy()) {
                          if (!dummyActive) {
                              Vec3 pos = {0, 2, 0};
                              if (tr) getVec(mGetPos, tr, &pos);
                              pos.y += 2.0f;
                              setVec(mSetPos, dummyTr, pos);
                              dummyActive = true;
                          }
                          Vec3 pos;
                          if (getVec(mGetPos, dummyTr, &pos)) {
                              float h = *(float*)((char*)orbit + offAngleH) * 0.0174532925f;
                              float sp = 12.0f * dt;
                              float fz = (float)g_fz, fx = (float)g_fx, fy = (float)g_fy;
                              pos.x += (__builtin_sinf(h) * fz + __builtin_cosf(h) * fx) * sp;
                              pos.z += (__builtin_cosf(h) * fz - __builtin_sinf(h) * fx) * sp;
                              pos.y += fy * sp;
                              setVec(mSetPos, dummyTr, pos);
                          }
                          target = dummyTr;
                      }
                  } else {
                      PInfo ps[24];
                      int n = getPlayers(ps, 24);
                      if (n > 0) {
                          if (specIdx >= n) specIdx = 0;
                          target = goTransform(ps[specIdx].go);
                      }
                  }
                  if (target) *(void**)((char*)orbit + offOrbitPlayer) = target;
              } else if (camHooked) {
                  if (orbit) *(void**)((char*)orbit + offOrbitPlayer) = origTarget;
                  camHooked = false;
                  dummyActive = false;
              }
              g_freeze = (fc || spec || g_autoBusy);
          }
          
